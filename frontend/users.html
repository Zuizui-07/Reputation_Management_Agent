<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users — Reputation Manager</title>

    <!-- Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/users.css">
</head>

<body>
    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>

    <div class="app-layout">

        <!-- ═══ Sidebar ═══ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__logo">
                <div class="sidebar__brand">REPUTATION MGR</div>
                <div class="sidebar__company">AUXILO FINSERVE</div>
            </div>

            <nav class="sidebar__nav">
                <a href="inbox.html" class="nav-item" id="navInbox">
                    <span class="nav-item__icon">📥</span>
                    <span class="nav-item__label">Inbox</span>
                    <span class="nav-item__badge" id="pendingBadge" style="display:none;">0</span>
                </a>
                <a href="autosent.html" class="nav-item" id="navAutosent">
                    <span class="nav-item__icon">📤</span>
                    <span class="nav-item__label">Auto-sent Log</span>
                </a>
                <a href="users.html" class="nav-item active" id="navUsers">
                    <span class="nav-item__icon">👥</span>
                    <span class="nav-item__label">Manage Users</span>
                </a>
                <a href="activity.html" class="nav-item" id="navActivity" style="display:none;">
                    <span class="nav-item__icon">📋</span>
                    <span class="nav-item__label">Activity Logs</span>
                </a>
                <a href="knowledge.html" class="nav-item" id="navKnowledge">
                    <span class="nav-item__icon">🧠</span>
                    <span class="nav-item__label">Knowledge Base</span>
                </a>
            </nav>

            <div class="sidebar__admin">
                <div class="admin-chip">
                    <div class="admin-chip__avatar">A</div>
                    <div class="admin-chip__info">
                        <div class="admin-chip__email" id="adminEmail">loading…</div>
                        <div class="admin-chip__role" id="adminRole">Super Admin</div>
                    </div>
                    <button class="admin-chip__logout" id="logoutBtn" title="Logout">⏻</button>
                </div>
            </div>
        </aside>

        <!-- ═══ Main Content ═══ -->
        <main class="main-content">
            <div class="users-page">
                <div class="users-header">
                    <div class="users-header__left">
                        <h2>Manage Users</h2>
                        <div class="users-header__count" id="userCount">Loading…</div>
                    </div>
                    <button class="btn--add-user" id="addUserBtn">
                        <span class="icon">＋</span>
                        Add User
                    </button>
                </div>

                <div class="users-table-wrap">
                    <table class="users-table" id="usersTable">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Created</th>
                                <th style="text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- ═══ Add User Modal ═══ -->
    <div class="modal-overlay" id="addUserModal">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title">Add New User</h3>
                <button class="modal__close" id="modalCloseBtn">✕</button>
            </div>
            <div class="modal__body">
                <div class="form-group">
                    <label for="newUserEmail">Email</label>
                    <input type="email" id="newUserEmail" placeholder="user@example.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="newUserPassword">Password</label>
                    <input type="password" id="newUserPassword" placeholder="Min 6 characters"
                        autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="newUserRole">Role</label>
                    <select id="newUserRole">
                        <option value="admin">Admin</option>
                        <option value="superadmin">Superadmin</option>
                    </select>
                </div>
                <div class="form-error" id="formError"></div>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" id="modalCancelBtn">Cancel</button>
                <button class="btn btn--primary" id="modalSubmitBtn">
                    <span class="btn-text">Create User</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ Delete Confirm Modal ═══ -->
    <div class="modal-overlay" id="deleteConfirmModal">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title">Delete User</h3>
                <button class="modal__close" id="deleteCloseBtn">✕</button>
            </div>
            <div class="modal__body">
                <p class="confirm-text">
                    Are you sure you want to delete <strong id="deleteUserEmail"></strong>?
                    This action cannot be undone.
                </p>
            </div>
            <div class="modal__footer">
                <button class="btn btn--ghost" id="deleteCancelBtn">Cancel</button>
                <button class="btn btn--danger" id="deleteConfirmBtn">
                    <span class="btn-text">Delete</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/users.js"></script>
</body>

</html>
